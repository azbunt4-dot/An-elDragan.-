<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnđelDragan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;

            /* Ne dozvoljava direktno upravljanje videom */
            pointer-events: none;

            user-select: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        src="AnđelDragan_GitHub.mp4"
        playsinline
        preload="auto"
        loop
        controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
        disablepictureinpicture
        disableremoteplayback>
    </video>

    <script>
        const video = document.getElementById("video");

        // Prvi klik/tap BILO GDE na stranici
        function pokreniVideo() {
            video.muted = false;
            video.volume = 1.0;

            video.play();

            // Nakon prvog klika više ne treba listener
            document.removeEventListener("pointerdown", pokreniVideo);
        }

        document.addEventListener("pointerdown", pokreniVideo);

        // Ako se video završi, kreće ponovo od početka
        video.addEventListener("ended", () => {
            video.currentTime = 0;
            video.play();
        });

        // Ako neko pokuša da ga pauzira, odmah nastavlja
        video.addEventListener("pause", () => {
            video.play();
        });

        // Sprečava tastaturu da upravlja videom
        document.addEventListener("keydown", (e) => {
            e.preventDefault();
        });

        // Sprečava kontekstni meni
        document.addEventListener("contextmenu", (e) => {
            e.preventDefault();
        });
    </script>

</body>
</html>
