<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnđelDragan</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
    pointer-events: none;
}
</style>
</head>

<body>

<!-- VIDEO KOJI SE PRIKAZUJE -->
<video
    id="video"
    src="AnđelDragan_GitHub.mp4"
    playsinline
    preload="auto"
    loop>
</video>

<!-- VIDEO IZ KOJEG SE KORISTI SAMO ZVUK -->
<video
    id="audio"
    src="Rođendan.webm"
    preload="auto"
    loop
    style="display:none;">
</video>

<script>
const video = document.getElementById("video");
const audio = document.getElementById("audio");

let pokrenuto = false;

function pokreni() {
    if (pokrenuto) return;

    pokrenuto = true;

    video.controls = false;

    // Glavni video
    video.muted = false;
    video.volume = 0;

    // Zvuk iz drugog videa
    audio.muted = false;
    audio.volume = 1;

    video.play().catch(() => {});
    audio.play().catch(() => {});
}

/* Prvi dodir bilo gde na ekranu */
document.addEventListener("pointerdown", pokreni, {
    once: true
});

/* Za telefone */
document.addEventListener("touchstart", pokreni, {
    once: true
});
</script>

</body>
</html>
