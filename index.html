<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>AnđelDragan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
        }

        /* Nevidljivi sloj preko CELOG ekrana */
        #startLayer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 9999;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Kada se video jednom pokrene, sloj nestaje */
        #startLayer.hidden {
            display: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
        controls="false"
        controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
        disablepictureinpicture
        disableremoteplayback>
        
        <source
            src="AnđelDragan_GitHub.mp4"
            type="video/mp4">
    </video>

    <!-- Klik bilo gde na ekranu -->
    <div id="startLayer"></div>

    <script>
        const video = document.getElementById("video");
        const startLayer = document.getElementById("startLayer");

        async function startVideo() {
            try {
                // Zvuk uključen
                video.muted = false;
                video.volume = 1;

                // Kreće od početka
                video.currentTime = 0;

                // Pokreni video
                await video.play();

                // Ukloni nevidljivi sloj
                startLayer.classList.add("hidden");

            } catch (error) {
                console.log("Video nije mogao da se pokrene:", error);
            }
        }

        // Radi na tapu telefona
        startLayer.addEventListener("touchstart", function(event) {
            event.preventDefault();
            startVideo();
        }, { passive: false });

        // Radi na kliku
        startLayer.addEventListener("click", function() {
            startVideo();
        });

        // Video se beskonačno ponavlja
        video.addEventListener("ended", function() {
            video.currentTime = 0;
            video.play();
        });

        // Ako se slučajno pauzira nakon pokretanja,
        // nastavi reprodukciju.
        video.addEventListener("pause", function() {
            if (startLayer.classList.contains("hidden")) {
                video.play();
            }
        });

        // Blokiraj kontekstni meni
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });
    </script>

</body>
</html>
