<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnđelDragan</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;

    /* Sprečava dodir direktno na video */
    pointer-events: none;
}
</style>
</head>

<body>

<video id="video"
       src="AnđelDragan_GitHub.mp4"
       playsinline
       preload="auto"
       loop>
</video>

<script>
const video = document.getElementById("video");

let pokrenuto = false;

function pokreni() {
    if (pokrenuto) return;

    pokrenuto = true;

    video.controls = false;
    video.muted = false;
    video.volume = 1;

    video.play().catch(() => {
        pokrenuto = false;
    });
}

/* Prvi dodir pokreće video sa zvukom */
document.addEventListener("pointerdown", pokreni, { once: true });

/* Ako telefon koristi touch događaj */
document.addEventListener("touchstart", pokreni, { once: true });

/* Ako neko pokuša da zaustavi video, odmah ga nastavi */
video.addEventListener("pause", () => {
    if (pokrenuto) {
        video.play().catch(() => {});
    }
});
</script>

</body>
</html>
